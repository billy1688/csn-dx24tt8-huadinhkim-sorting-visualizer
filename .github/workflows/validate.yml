name: Kiểm tra source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Kiểm tra HTML và JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Tải source
        uses: actions/checkout@v7

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Kiểm tra file bắt buộc
        run: |
          test -f src/index.html
          test -f src/css/style.css
          test -f src/js/app.js
          test -f src/js/visualizer.js
          test -f src/js/comparison.js

      - name: Kiểm tra cú pháp JavaScript
        run: find src/js -type f -name '*.js' -exec node --check {} \;
