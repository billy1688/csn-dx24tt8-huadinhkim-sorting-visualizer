name: Triển khai GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Kiểm tra mã nguồn trước khi đăng
        run: node --test tests/source.test.cjs

      - name: Thiết lập GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói ứng dụng tĩnh trong src
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./src

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Đăng trang lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
